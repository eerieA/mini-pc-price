# How a listing title maps onto a chassis.yaml key (plan.md §5).
#
# This file describes RETAILERS' NAMING. chassis.yaml describes hardware and
# cites a vendor document per entry; keeping them separate is deliberate, so an
# eTek quirk never ends up inside a Dell fact.
#
# ── Why this is a table and not a parser ─────────────────────────────────────
# The obvious approach — read brand, model and form factor out of the title —
# does not survive this vendor's copy. The form-factor word is boilerplate
# pasted between listings, not a specification:
#
#   - the OptiPlex 9020 listing contains "tiny", "micro", "sff", "usff",
#     "ultra" AND "small form factor", all six, for one machine
#   - the 3070's title says "Mini"; its chassis key says micro; its description
#     says "tiny"
#   - both 3080 listings say "Ultra" in the title and "Micro" 8-9 times in the
#     description, which is the correct one
#
# Brand plus model number, by contrast, is clean: nine values across eTek's ten
# listings, no collisions, and it survives the vendor misspelling the product
# "Optiflex" because neither input depends on the product name being spelled
# right. So the model number is matched and the form-factor segment comes from
# whoever adds the line here, read off vendor documentation.
#
# Two rules for the code that uses this:
#   - Strip the CPU token before matching the model number, or the 5060
#     listing's "i5-8500" reads as a second model number.
#   - Never read the Shopify handle. Both 3080 handles say "3090" and the 9020's
#     says "dell-optiplex-3070-...-copy" — duplicated from another product and
#     never renamed. The handle is a fine unique key for a listing; it is not
#     evidence about the hardware.
#
# A (brand, model_number) pair that is absent is parse_ok = false and is held out
# of the ranking. Same rule as a missing chassis entry, same reason: never
# default (§5).

dell:
  "9020": dell-optiplex-9020-micro
  "5060": dell-optiplex-5060-micro
  "3070": dell-optiplex-3070-micro
  "7070": dell-optiplex-7070-micro
  "3080": dell-optiplex-3080-micro   # titles say "Ultra"; see chassis.yaml
  "3060": dell-optiplex-3060-micro
  "7010": dell-optiplex-7010-micro   # the 2023 model, not the 2012 one
  # "5050" is deliberately ABSENT. The OptiPlex 5050 ships as Micro, SFF and
  # Tower, and only the SFF is entered in chassis.yaml -- a bare "5050" alias
  # would resolve a 5050 Micro (2 SODIMM) to the SFF entry (4 UDIMM) and price
  # its upgrade ~$350 wrong. A test caught exactly this. The same hazard applies
  # to any model number whose form factors differ; see the note at the bottom.

hp:
  "600g3": hp-prodesk-600-g3-sff
  "400g5": hp-prodesk-400-g5-mini
  "800g4": hp-elitedesk-800-g4-mini
  "800g3": hp-elitedesk-800-g3-sff
  "800g5": hp-elitedesk-800-g5-mini
  "800g6": hp-elitedesk-800-g6-mini
  "600g6": hp-prodesk-600-g6-mini

lenovo:
  "m73": lenovo-m73-tiny
  "m70q": lenovo-m70q-tiny
  "m80q": lenovo-m80q-tiny
  "m70s": lenovo-m70s-sff
  "p340": lenovo-p340-tiny   # ThinkStation; also a Tower and SFF -- see below

# Model numbers are quoted so YAML reads them as strings — unquoted, 3080 is an
# integer and 600g3 is not, which would make the lookup type-dependent.
#
# Note these keys are NOT canonical_key (§4). canonical_key is
# dell:optiplex3070:i5-9500t:16gb:256gb and carries no form-factor segment, so
# it cannot produce a chassis key and the two are built independently.

# ── One model number can be several chassis ──────────────────────────────────
# This table maps a model number to ONE chassis, and that is a real limitation
# rather than a simplification: Dell and HP ship the same number as Micro, SFF
# and Tower with different socket counts, and the RAM upgrade cost differs by
# ~$350 between a 2-slot SODIMM machine and a 4-socket UDIMM one.
#
# An alias is therefore only safe when the number resolves to one form factor in
# the inventory actually tracked. Where it does not, leave the alias out -- an
# unknown chassis is held out of the ranking and surfaced (§5), which is the
# outcome this table's whole design prefers to a confident guess. The "5050"
# entry above was removed for exactly this reason.
#
# Three aliases here carry the hazard unresolved, because each model ships in a
# second form factor that is not currently in tracked inventory:
#   600g3  -> ...-sff   (4 sockets). A 600 G3 Mini would price ~$350 wrong.
#   800g4  -> ...-mini  (2 sockets). An 800 G4 SFF would price ~$350 wrong.
#   p340   -> ...-tiny  (2 sockets). A P340 Tower or SFF would price wrong.
# All are correct for what is being polled today. If another form factor
# appears, the fix is to split the alias -- not to pick the likelier one.
#
# 800g4 was re-checked when ITRefurbs was added (2026-09-27), because one of its
# two 800 G4 listings is titled plain "Desktop" with no form-factor word. Its
# description gives 6.97 x 6.89 x 1.34 in, which is the Desktop Mini; the SFF
# is several times that volume. So the alias held. The next "800 G4 Desktop"
# from a new source needs the same check, not the same assumption. The P340
# was identified the same way (chassis.yaml).
#
# Lenovo needs none of this: the suffix IS the form factor (q = Tiny, s = SFF),
# so m70q and m70s are distinct keys with no ambiguity to resolve.
