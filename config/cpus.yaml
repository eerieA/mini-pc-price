i7-10700T: {cores: 8, threads: 16, gen: 10, tdp: 35, nested_virt: true}
# The most capable 35 W part in this table: 8c/16t in a Mini chassis.
# https://www.intel.com/content/www/us/en/products/sku/199314/intel-core-i710700t-processor-16m-cache-up-to-4-50-ghz/specifications.html

# ── 12th gen and later: `cores` means P-cores ────────────────────────────────
# Alder Lake introduced a hybrid layout, and it breaks the assumption `cores`
# was written under. Intel's own "Total Cores" for an i5-13500T is 14 — six
# P-cores plus eight Gracemont E-cores — and recording that number would let
# E-cores satisfy a requirement whose entire purpose is sizing an EVE-NG host.
# E-cores have no SMT, lower clocks and a different scheduling story; a lab node
# pinned to one is not the node this requirement is asking for.
#
# So `cores` here is the P-core count, and the ARK total is recorded alongside
# it in a comment rather than in the field. This is the same choice chassis.yaml
# makes with ram_max_gb: record the number the ranking should read, and keep the
# other one where a human can see it and code cannot act on it.
#
# Revisit if a hybrid machine ever ranks close enough to matter — this trades a
# little accuracy for the guarantee that cpu_cores never overstates the host.
i5-12500:  {cores: 6, threads: 12, gen: 12, tdp: 65, nested_virt: true}
# Not actually hybrid: 6 P-cores, zero E-cores, so ARK's total is 6 and there is
# no discrepancy to resolve. Listed here for the generation, not the caveat.
i5-13500T: {cores: 6, threads: 12, gen: 13, tdp: 35, nested_virt: true}
# ARK total: 14 cores / 20 threads (6 P + 8 E). P-core figures recorded.
# https://www.intel.com/content/www/us/en/products/sku/230578/intel-core-i513500t-processor-24m-cache-up-to-4-60-ghz/specifications.html
i5-14400T: {cores: 6, threads: 12, gen: 14, tdp: 35, nested_virt: true}
# ARK total: 10 cores / 16 threads (6 P + 4 E). P-core figures recorded.
# https://www.intel.com/content/www/us/en/products/sku/236790/intel-core-i5-processor-14400t-20m-cache-up-to-4-50-ghz/specifications.html

# ── Added for ITRefurbs inventory, 2026-09-27 ────────────────────────────────
i3-10300T: {cores: 4, threads: 8,  gen: 10, tdp: 35, nested_virt: true}
# Intel ARK, verified 2026-09-27: 4 cores / 8 threads, 35 W, VT-x with EPT.
# https://www.intel.com/content/www/us/en/products/sku/199282/intel-core-i310300t-processor-8m-cache-up-to-3-90-ghz/specifications.html
# In ITRefurbs' ThinkStation P340 Tiny. Four cores, so that listing misses
# cpu_cores whatever its chassis can take.

