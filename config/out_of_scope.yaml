# Listings judged by hand not to be candidates (plan.md §9, Phase 3).
#
# ITRefurbs' collection mixes minis with towers and gaming rigs. Those are not
# parse failures, and reporting them as parse failures every day would bury the
# warning that catches real ones (§8). An entry here moves a listing to a one-line
# OUT OF SCOPE section of the report instead.
#
# Keyed by URL and written by hand, never by a title rule: ITRefurbs' "ThinkStation
# P340 Workstation" is a P340 Tiny, and a rule on "workstation" would have hidden
# it (src/out_of_scope.py). So a new tower appears once as parse_ok=false, and is
# added here after someone has looked at it.
#
# Out of scope means the FORM FACTOR (towers stay out, plan.md §3), not a machine
# that merely misses a requirement -- those rank as near-misses, which is how
# rules.yaml stays tunable. Don't list a mini here because it is a poor buy.
#
# `reason` is required; `decided` is for whoever re-reads this later. Entries
# for listings that have sold out are harmless and can be pruned whenever.

