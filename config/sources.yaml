# Where listings come from (plan.md §3), and what each vendor's risk is worth.
#
# The sources not yet added are listed as comments rather than stubs so the §3
# decisions are visible to anyone reading the config, not only the plan.

sources:
  - id: etek
    name: eTek Laptop (Etek Liquidators Inc., Saint-Laurent QC)
    type: refurbisher
    # Shopify tier-0: structured JSON at a stable URL, no selectors to maintain
    # or silently break (§5, §8).
    products_json: "https://www.eteklaptop.ca/collections/tiny-computer-and-mini-pcs-usff/products.json?limit=250"
    product_url_base: "https://www.eteklaptop.ca/products"
    discovery_urls:
      - "https://www.eteklaptop.ca/collections/tiny-computer-and-mini-pcs-usff"
    # No `selectors:` key — the tier-0 JSON path handles this source end to end.

    source_adjustment: 40
    # Dollars added to effective_price for vendor recourse risk (§2, §3).
    # Anchored to a published number: a 30% restocking fee on non-defective
    # returns is ~$105 on a $350 unit, against a 15-day window, customer-paid
    # return shipping and a 60-day warranty. It is not an expected value and has
    # not been calibrated — it exists so a genuinely cheap listing can still win,
    # which a blanket exclusion would not allow, and so the penalty is visible in
    # the output and editable in one line.
    #
    # The number matters here because eTek's binding requirements — nested
    # virtualisation, the chassis RAM ceiling — are only fully verifiable after
    # the box is open, which is exactly when the restocking fee applies.

  - id: itrefurbs
    name: ITRefurbs
    type: refurbisher
    # Also Shopify tier-0 (confirmed 2026-09-25), so no ChangeDetection and no
    # selectors -- the premise plan.md §9 originally gave Phase 3.
    products_json: "https://itrefurbs.ca/collections/refurbished-desktops/products.json?limit=250"
    product_url_base: "https://itrefurbs.ca/products"
    discovery_urls:
      - "https://itrefurbs.ca/collections/refurbished-desktops"
    # A mixed collection: minis beside towers and gaming rigs. The towers are
    # dismissed by URL in out_of_scope.yaml rather than reported as parse
    # failures, and a new one surfaces once as parse_ok=false until it is.

    source_adjustment: 25
    # One first-hand report of multi-week shipping delays, attributed to QC
    # repairing a fault before shipping (plan.md §3,
    # research/Refurbishedguide-1sf2s9v-itrefurbs.md). Slow, not a failure to
    # deliver or refund -- a price, not a gate. Unlike eTek's $40 it is not
    # anchored to a published number, and it is held loosely for that reason.

  - id: ebay
    name: eBay.ca (Browse API)
    type: marketplace
    # Structured JSON from eBay's Browse API (plan.md §3, §9 Phase 4): no
    # selectors, and seller reputation arrives as fields. Credentials come from
    # the environment, never from here -- see src/ebay.py.
    browse_api: EBAY_CA
    # Fixed-price only: auctions are a different purchase mode from the buy-now
    # assumption running through §2.
    filter: "buyingOptions:{FIXED_PRICE},deliveryCountry:CA"
    # PC Desktops & All-In-Ones. Without it the API searches every category:
    # the first live "OptiPlex 3080 Micro" search returned 161 items, of which
    # 34 were machines and the rest motherboards, power supplies, RAM and
    # cases. eBay's web search had defaulted to this category in the capture,
    # which is why plan.md never planned for it. A category is a structured
    # field, so this is a filter, not a guess -- the keyword list below still
    # catches what sellers miscategorise (a caddy, in that same search).
    category_ids: "179"

    # One search per chassis that can reach 64 GB. A capped chassis cannot
    # qualify at any price, so searching for it only adds near-misses. eBay's
    # search is fuzzy -- "3080 Micro" also returns 7080s, 3080 SFFs and parts --
    # which is what the form-factor guard (src/specs.py) and the keyword list
    # below are for. Add a query when a chassis is added to chassis.yaml.
    queries:
      - "OptiPlex 3080 Micro"
      - "OptiPlex 7010 Micro"       # also matches the 2012 7010 USFF, whose
                                    # 3rd-gen CPUs are not in cpus.yaml
      - "EliteDesk 800 G5 Mini"
      - "EliteDesk 800 G6 Mini"
      - "ProDesk 600 G6 Mini"
      - "ThinkCentre M70q"
      - "ThinkCentre M80q"
      - "ThinkStation P340 Tiny"
      # 4-socket SFFs: 64 GB from two UDIMM kits, about half the SODIMM cost.
      - "ProDesk 600 G3 SFF"
      - "EliteDesk 800 G3 SFF"
      - "ThinkCentre M70s"

    # Words that mark a part rather than a machine (plan.md §6). A title
    # containing one is set aside and counted by word in the digest, so a word
    # hiding real listings shows up as a large count. The rule for adding one:
    # it must name a PART, never a machine type or an accessory -- "mount" fails
    # ("VESA mount included" is common in real titles), and so would
    # "workstation" (the P340 is one).
    exclude_keywords:
      - caddy
      - bezel
      - motherboard
      - barebone

    # No source_adjustment. A marketplace's risk is the seller's, not eBay's,
    # and is priced per listing by sellers.yaml's fulfillment_adjustment.

# ── The collection handle IS the selector ────────────────────────────────────
# Shopify answers a wrong or retired handle with HTTP 200 and {"products": []},
# which is indistinguishable from a sold-out collection. Tier 0 removes selector
# breakage but not this. poll.py treats an empty response as a failure, never as
# zero results (§8).
#
# Confirmed 2026-09-22: the handle above returns 10 products. Handles guessed by
# hand (`mini-pc`, `mini-pcs`, `mini-desktop`) all return 200 with an empty array
# and are NOT the collection.

# ── Excluded, with reasons (§3) ──────────────────────────────────────────────
#   uniway    — legitimate business, real storefronts, but consistently marked
#               up. That is a reason not to track a source at all, and it has
#               nothing to do with trust.
#   refurb_io — fulfillment and refund failures reported from 2022 onward.
#   refurbish_canada
#             — Shopify tier-0 and technically ideal (67 mini/SFF desktops, 41
#               stating NVMe), gated 2026-09-25 on fulfillment. Trustpilot 1.9/5
#               across 55 reviews, 77% one-star: shipping far past the stated
#               7-14 days, support ignoring email and phone, refunds refused,
#               with one first-hand report of delivery only after a PayPal
#               dispute was escalated. source_adjustment prices recourse risk,
#               but that assumes recourse works (plan.md §3).
#               Their chassis remain in chassis.yaml -- those are hardware facts,
#               and the same models recur at every refurbisher.
#   openbox   — good reputation, but sells zero desktops; consumer returns only.
#               Excluded on fit, not on conduct.
#
# ── Not yet added ────────────────────────────────────────────────────────────
#   dell_outlet       Phase 3b. The best vendor here to actually buy from —
#                     manufacturer warranty, clean RMA, source_adjustment 0 —
#                     but JSON-LD parsing makes it the harder thing to build
#                     first, and Phase 1 learns nothing that requires it.
